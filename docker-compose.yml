# ---------------------------------------------------------------------------
# Subida completa: aplicação + PostgreSQL.
#
#   cp .env.example .env    (e preencha os valores)
#   docker compose up -d --build
#   docker compose exec app npx tsx prisma/seed.ts
#
# Redis não entra: o estado do atendimento vive no PostgreSQL de propósito, e
# uma dependência a mais só faria sentido quando houver fila real de mensagens.
# ---------------------------------------------------------------------------
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-automa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-automa}
    volumes:
      - postgres-dados:/var/lib/postgresql/data
    # A porta fica exposta só para a máquina local: o banco não precisa estar
    # acessível de fora para a aplicação falar com ele pela rede do compose.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-automa} -d ${POSTGRES_DB:-automa}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-automa}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-automa}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-automa}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-automa}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?defina AUTH_SECRET no .env}
      APP_URL: ${APP_URL:-http://localhost:3000}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-}
      WHATSAPP_API_URL: ${WHATSAPP_API_URL:-}
      WHATSAPP_API_KEY: ${WHATSAPP_API_KEY:-}
      WHATSAPP_INSTANCE: ${WHATSAPP_INSTANCE:-}
      WHATSAPP_WEBHOOK_TOKEN: ${WHATSAPP_WEBHOOK_TOKEN:-}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PAGAMENTO_EXPIRA_MINUTOS: ${PAGAMENTO_EXPIRA_MINUTOS:-60}
      BACKUP_CRON_TOKEN: ${BACKUP_CRON_TOKEN:-}
      BACKUP_DIR: /app/storage/backups
    volumes:
      - app-storage:/app/storage
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

volumes:
  postgres-dados:
  app-storage:
